[workspace]

[package]
name = "loop-desktop"
version = "0.1.0"
description = "Loop agent company OS"
edition = "2021"

[lib]
name = "loop_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
